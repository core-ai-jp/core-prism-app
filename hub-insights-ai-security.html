<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><link rel="icon" href="/core-icon-v2.svg"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>安心して任せるために、止め方から設計する。 | CORE</title><meta name="description" content="情報・権限・外部接続・記録・事故対応。AI導入の安全策を日々の業務に落とし込みます。"/><link rel="canonical" href="https://www.core-ai.jp/insights/ai-security"/><meta property="og:title" content="安心して任せるために、止め方から設計する。"/><meta property="og:description" content="情報・権限・外部接続・記録・事故対応。AI導入の安全策を日々の業務に落とし込みます。"/><meta property="og:url" content="https://www.core-ai.jp/insights/ai-security"/><meta property="og:type" content="article"/><meta property="og:image" content="https://www.core-ai.jp/og-core-v2.png"/><meta name="referrer" content="strict-origin-when-cross-origin"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","name":"安心して任せるために、止め方から設計する。","headline":"安心して任せるために、止め方から設計する。","url":"https://www.core-ai.jp/insights/ai-security","datePublished":"2026-10-29","dateModified":"2026-10-29","author":{"@type":"Organization","name":"株式会社CORE"}}</script></head><body><div id="root"></div><noscript><h1>安心して任せるために、止め方から設計する。</h1><p>情報・権限・外部接続・記録・事故対応。AI導入の安全策を日々の業務に落とし込みます。</p><h2>何を入力してよいかを決める</h2><p>公開、社内、機密、個人情報を区分し、利用する契約とサービスのデータ条件を確認します。保存期間、削除、学習への利用、接続先の権限は契約ごとに確認が必要です。</p><h2>必要なものだけにアクセスする</h2><p>全社の管理者権限を最初から与えず、業務に必要な文書と操作に限定します。退職・異動・連携終了時にアクセスを取り消せるよう、責任者と棚卸し日を決めます。</p><h2>外部情報に書かれた命令を信用しない</h2><p>メール、Web、PDFには、AIを別の行動へ誘導する文言が紛れ込む可能性があります。外部情報は判断材料として扱い、権限や目的の変更を許さない境界を設けます。</p><h2>接続ツールもソフトウェアとして審査する</h2><p>MCPサーバー、プラグイン、依存ライブラリの提供元、更新、必要権限を確認します。接続しただけで安全になったとは扱いません。変更前後の検証と復元手順を用意します。</p><h2>事故時は止める、守る、確かめる</h2><p>誤送信や漏えいが疑われたら、関連する自動処理を止め、証拠を保全し、担当者へ連絡します。影響範囲を確認し、必要な通知や専門家への相談を判断します。記録を消して解決扱いにしないでください。</p><h2>自己点検は監査保証ではない</h2><p>問診で不足を見つけ、改善の順番を考えることはできます。外部サイトの能動スキャンや、法令適合・脆弱性不存在の保証を行うものではありません。個別の法務・専門判断は担当専門家に確認してください。</p><a href="/insights">CORE Intelligence Hub</a><p>フォームの利用にはJavaScriptを有効にしてください。</p></noscript><script type="module" src="/src/hubMain.tsx"></script></body></html>
