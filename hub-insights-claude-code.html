<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><link rel="icon" href="/core-icon-v2.svg"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Claude Codeに、チームの仕事の進め方を渡す。 | CORE</title><meta name="description" content="CLAUDE.md、Skills、Hooks、Subagentsの役割を分け、検証と権限管理を組み込みます。"/><link rel="canonical" href="https://www.core-ai.jp/insights/claude-code"/><meta property="og:title" content="Claude Codeに、チームの仕事の進め方を渡す。"/><meta property="og:description" content="CLAUDE.md、Skills、Hooks、Subagentsの役割を分け、検証と権限管理を組み込みます。"/><meta property="og:url" content="https://www.core-ai.jp/insights/claude-code"/><meta property="og:type" content="article"/><meta property="og:image" content="https://www.core-ai.jp/og-core-v2.png"/><meta name="referrer" content="strict-origin-when-cross-origin"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","name":"Claude Codeに、チームの仕事の進め方を渡す。","headline":"Claude Codeに、チームの仕事の進め方を渡す。","url":"https://www.core-ai.jp/insights/claude-code","datePublished":"2026-10-29","dateModified":"2026-10-29","author":{"@type":"Organization","name":"株式会社CORE"}}</script></head><body><div id="root"></div><noscript><h1>Claude Codeに、チームの仕事の進め方を渡す。</h1><p>CLAUDE.md、Skills、Hooks、Subagentsの役割を分け、検証と権限管理を組み込みます。</p><h2>短い入口と、必要なときに読む手順</h2><p>CLAUDE.mdには、プロジェクトで繰り返し必要になる情報を整理します。個別の作業手順はSkillsなどへ分け、無関係な指示を常に大量に読み込ませない構成にします。</p><h2>Hooksは自動処理。権限の代わりにはしない</h2><p>Hooksでは特定のタイミングの処理を定義できます。実行するスクリプト自体の安全性と権限もレビューします。AIへのお願いだけで必須検査を守ろうとせず、CIやアクセス制御と組み合わせます。</p><h2>Subagentsは目的と所有範囲を限定する</h2><p>レビューや限定された調査を分けるときは、担当するファイルと書き込み可否を明示します。並列化は常に速く安いとは限りません。重複調査と統合作業も含めて評価します。</p><h2>探索、計画、実装、検証をつなぐ</h2><p>小さな変更単位で受入条件を決め、テスト結果と画面を確認します。AIの完了報告だけを検証の代わりにせず、実行ログと実物を残します。</p><h2>コストと機密性を担当者が管理する</h2><p>契約、データの取扱い、実行環境、利用上限を導入時に確認します。必要な情報だけを渡し、秘密鍵を会話やリポジトリに貼り付けない運用を決めます。</p><a href="/insights">CORE Intelligence Hub</a><p>フォームの利用にはJavaScriptを有効にしてください。</p></noscript><script type="module" src="/src/hubMain.tsx"></script></body></html>
